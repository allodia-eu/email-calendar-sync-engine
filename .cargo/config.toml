# Cargo settings that must hold for EVERY build of this workspace — not only the ones the client
# build scripts drive. This file is tracked.

# ---------------------------------------------------------------------------------------------
# No `build.build-dir` here: each checkout builds in its own `target/`, Cargo's default.
#
# ⚠️ **Never point two checkouts at one build directory**, a shared `build-dir` or
# `CARGO_TARGET_DIR` in a personal config included. Cargo names a workspace crate's artifact, and
# the fingerprint guarding it, from its workspace-*relative* path, and judges freshness by mtime,
# so a checkout sharing a directory with another is handed that checkout's binary: `cargo test`
# reports `ok` for an assertion this tree cannot satisfy. Sharing compile work between worktrees
# is a compiler cache's job, keyed on content (docs/agent-guidance/rust.md, "Share the compile
# work with kache"). `rustc-wrapper` stays out of this file: it would break every build lacking
# that binary, CI's included.
#
# ⚠️ **Never bake an absolute path into a compiled artifact.** A compiler cache can hand this
# checkout a crate compiled in another one, and anything `env!` resolved at compile time travels
# with it. `env!("CARGO_BIN_EXE_<name>")` and `env!("CARGO_MANIFEST_DIR")` are the two that matter:
# the artifact reads or spawns a *different* checkout's copy, and once that checkout is deleted it
# fails with `NotFound` in a tree whose diff cannot explain it. Cargo exports both to the process
# at run time as well, so read them with `std::env::var` and keep the `env!` only as a fallback for
# running the binary outside cargo (`crates/engine-cli/tests/binary.rs`).
#
# ⚠️ **A string, never an array**, for any value added to this file. A worktree under
# `.claude/worktrees/` reads its own copy of this file and the main checkout's, and cargo
# concatenates arrays across files where the nearer string simply wins: an array is passed twice
# in every worktree, which changes cargo's artifact hashes, so no compiler cache can match a
# worktree against the main checkout.
# ---------------------------------------------------------------------------------------------
