# The one Rust version this repo builds with, everywhere: rustup reads this file for every cargo
# invocation inside the checkout, and CI installs exactly this channel (the `toolchain` job in
# .github/workflows/ci.yml parses it, so the version lives in one place). Pinning keeps local and
# CI byte-identical — without it a floating `stable` drifts a patch release ahead of the
# developer's toolchain, and CI fails on a lint nobody can reproduce locally. It also stabilizes
# the CI cache key, which contains the rustc version, so a mid-day stable release no longer
# invalidates every cache at once.
#
# Bumping is a deliberate, standalone PR: a new stable can add default-warn rustc/clippy lints, and
# this workspace denies all warnings (`[workspace.lints]` in the root Cargo.toml, plus
# `RUSTFLAGS: -D warnings` in CI), so the bump is where those surface and get fixed — not a red
# build on someone's unrelated change.
#
# This is a build pin, not the MSRV. The floor the crates promise is `rust-version` in the root
# Cargo.toml, and it moves independently.
#
# `cargo fmt` is the one exception: rustfmt.toml uses nightly-only options, so formatting runs on
# the pinned nightly instead — `cargo +nightly-2026-07-07 fmt` (see AGENTS.md).
[toolchain]
channel = "1.97.0"
components = ["clippy"]
