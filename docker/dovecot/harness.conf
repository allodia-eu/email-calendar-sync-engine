# Drop-in config for the Dovecot harness, merged over the image's own
# `/etc/dovecot/dovecot.conf` (which supplies the rootless listeners, the static
# passdb and the TLS paths — see https://doc.dovecot.org/main/installation/docker.html).
#
# Everything here exists to make this fixture an **IMAP4rev1** server that answers the
# way hosted Dovecot does, because that is what it is here to prove. Do not "fix" a
# setting to make a test easier: the divergences from Stalwart are the point.

# The stock image turns the UTF-8 mailbox-name extensions on, which makes it answer like
# an IMAP4rev2 server and hands names back as raw UTF-8. Off, so names travel as
# **modified UTF-7** (RFC 3501 §5.1.3) — the encoding every rev1 server uses, the one
# `provider_imap::utf7` exists to decode, and the one Stalwart's `UTF8=ACCEPT` can never
# produce.
mail_utf8_extensions = no
mailbox_list_utf8 = no

namespace inbox {
  # The special-use set is declared here rather than left to the image's
  # `@mailbox_defaults = english`, which assigns `\Drafts` and `\Sent` but no `\Archive`
  # — so the fixture states its own shape and an image bump cannot quietly change it.
  # `auto = subscribe` creates each one at first login, so seeding only has to add mail.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  # A deliberately non-ASCII name, so the folder list carries one mailbox whose wire
  # form is modified UTF-7 (`&ANw-berweisungen`) and whose display form is not. No
  # special use: it is an ordinary folder that happens to need decoding.
  mailbox Überweisungen {
    auto = subscribe
  }
}
