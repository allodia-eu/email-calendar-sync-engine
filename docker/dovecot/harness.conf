# Drop-in config **shared by both Dovecot harness services**, merged over the image's own
# `/etc/dovecot/dovecot.conf` (which supplies the rootless listeners, the static passdb and
# the TLS paths — see https://doc.dovecot.org/main/installation/docker.html).
#
# Everything that differs between the two servers lives beside this file, in `rev1.conf` and
# `rev2.conf` — one per service, three settings each. That split is the point: the pair
# differs **only** in the IMAP revision it speaks, so anything that diverged for another
# reason would make the two incomparable and the dialect stop being what the tests isolate.
# Do not "fix" a setting here to make one side's test easier.

namespace inbox {
  # The special-use set is declared here rather than left to the image's
  # `@mailbox_defaults = english`, which assigns `\Drafts` and `\Sent` but no `\Archive`
  # — so the fixture states its own shape and an image bump cannot quietly change it.
  # `auto = subscribe` creates each one at first login, so seeding only has to add mail.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  # A deliberately non-ASCII name. From this one declaration the two services put different
  # bytes on the wire — `&ANw-berweisungen` on rev1, raw UTF-8 on rev2 — which is exactly
  # what a test needs to assert that the folder reaches the model under one identity either
  # way. No special use: it is an ordinary folder that happens to need decoding on one half.
  mailbox Überweisungen {
    auto = subscribe
  }

  # The report suites' own mailbox, mirroring the Stalwart harness. Its two messages are
  # seeded in the entrypoint and kept out of INBOX, so a report — which stores a keyword
  # and may move the message — disturbs nothing another suite reads.
  mailbox Reported {
    auto = subscribe
  }
}
