# Deterministic Dovecot IMAP fixture for provider-imap tests — the second IMAP server
# beside the Stalwart one (docker/stalwart/), and the **IMAP4rev1** half of the pair.
#
# Stalwart is IMAP4rev2, where several extensions are folded into the base protocol and
# mailbox names are raw UTF-8. Dovecot is rev1: extensions are optional and must be
# negotiated, and mailbox names travel as modified UTF-7. Most IMAP accounts in the world
# terminate on a rev1 server, so the client's rev1 path is the one that must not rot.
# See docs/agent-guidance/imap-smtp.md → "Which server proves what".
#
# Host ports 11994/11144 avoid Stalwart's 11993/11143, so both can run at once.
# Determinism: the image is pinned by digest, the config is a committed drop-in, and the
# mail seed is the shared one. Start clean with `docker compose down -v` (CI always does).

name: dovecot-harness

services:
  dovecot:
    # dovecot/dovecot 2.4.1, pinned by multi-arch digest (linux/amd64 + linux/arm64).
    # Bump deliberately: re-resolve the digest and re-run the gated suite. The image's
    # own default mailbox set is deliberately not relied on (see harness.conf).
    image: dovecot/dovecot:2.4.1@sha256:1296e0f1029cdd95e6849fb82f5d142a6e2a46218451773316cea678de75254b
    # Keep the image's `tini` so the backgrounded server still reaps and forwards signals.
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/harness/entrypoint.sh"]
    environment:
      # The image's stock passdb is `static`: any username authenticates with this one
      # password. Throwaway, committed on purpose — this server never holds real data.
      USER_PASSWORD: "dovecot-alice-pw"
      HARNESS_ACCOUNT: "alice@test.local"
    volumes:
      - ./entrypoint.sh:/harness/entrypoint.sh:ro
      # A drop-in beside the image's own config, so the vendor rootless setup stays intact.
      - ./harness.conf:/etc/dovecot/conf.d/harness.conf:ro
      # The same messages the Stalwart harness seeds, so one dataset validates both.
      - ../stalwart/seed/mail:/harness/seed/mail:ro
      - dovecot-mail:/srv/vmail
    ports:
      # host:container, loopback only — never expose a test mail server on all
      # interfaces. The container ports are the image's rootless defaults.
      - "127.0.0.1:11994:31993" # IMAP (implicit TLS)
      - "127.0.0.1:11144:31143" # IMAP (STARTTLS)
    # Healthy once seeding wrote its marker AND the TLS port accepts a connection —
    # real readiness, not a sleep.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /srv/vmail/.dovecot-harness-ready && nc -z 127.0.0.1 31993
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  dovecot-mail:
