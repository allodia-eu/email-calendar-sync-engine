# A **master user** for both Dovecot harness services: an administrator that signs in as any
# account with SASL `PLAIN` and an authorization identity (RFC 4616), which is how a transfer
# host reads mailboxes it holds no per-account password for. `provider-imap`'s
# `live_imap_acting_as.rs` proves the engine's `Credential::ActingAs` against it.
#
# Its own drop-in rather than a section of `harness.conf`, so the shared mailbox shape and the
# sign-in shape stay separately readable. Master passdbs are consulted only when a sign-in names
# an authorization identity, so the image's static passdb still serves every other sign-in.
passdb master {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/master-users
  master = yes
  # After the master password checks out, look the target account up in the ordinary passdb,
  # as a production setup does so that a master user can act only as accounts that exist. The
  # image's static passdb knows every name, so here any account resolves (README.md).
  result_success = continue
}
