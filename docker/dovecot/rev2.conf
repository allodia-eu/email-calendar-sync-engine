# The **IMAP4rev2** half of the Dovecot pair (`docker-compose.yml` → `dovecot-rev2`), and a
# **second rev2 implementation** beside Stalwart — which is the whole reason it exists. One
# server's reading of a spec is an implementation, not the protocol: Dovecot's rev2 already
# disagrees with Stalwart's on whether an extended `LIST` still has to ask for the
# SPECIAL-USE attributes, and only a second server could show that.
#
# rev2 is **experimental** in Dovecot 2.4 (`--enable-experimental-imap4rev2`, compiled in as
# of the 2.4.4 image; the setting first appears in 2.4.2). Expect it to diverge from
# RFC 9051 in ways Stalwart does not — that is the value, not a defect in the fixture.
imap4rev2_enable = yes

# Not optional and not decoration: Dovecot refuses to start otherwise, with
# `imap4rev2_enable=yes requires mail_utf8_extensions=yes`. rev2 mailbox names are UTF-8
# (RFC 9051 §5.1), so the dialect and the encoding travel together. `mailbox_list_utf8`
# keeps names UTF-8 in storage to match, as the image's own config does.
mail_utf8_extensions = yes
mailbox_list_utf8 = yes
