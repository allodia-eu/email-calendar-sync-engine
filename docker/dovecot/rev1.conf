# The **IMAP4rev1** half of the Dovecot pair (`docker-compose.yml` → `dovecot-rev1`), and
# the dialect most IMAP accounts in the world actually terminate on.
#
# All three settings are stated even though every one of them matches Dovecot's *built-in*
# default, because the built-in default is not what applies: the image's own `dovecot.conf`
# sets all three to `yes` (2.4.4, config version 2.4.3) and a `conf.d` drop-in is included
# after it. Silence here would hand back a rev2 server, the client would `ENABLE` the
# dialect, and `live_imap_rev1.rs` would quietly stop testing rev1 — the one thing this
# service exists for.
imap4rev2_enable = no

# With the UTF-8 mailbox-name extensions off, names travel as **modified UTF-7**
# (RFC 3501 §5.1.3) — the encoding every rev1 server uses, the one `provider_imap::utf7`
# exists to decode, and the one no rev2 session can produce. Turning these on makes a rev1
# server answer with raw UTF-8 and leaves that module with no live coverage anywhere.
mail_utf8_extensions = no
mailbox_list_utf8 = no
