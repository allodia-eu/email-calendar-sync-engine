# Deterministic Stalwart protocol test harness (Stalwart v1).
#
# `docker compose up -d --wait` brings up a Stalwart server that self-bootstraps
# through its management API, creates the test accounts, and seeds one shared
# dataset every protocol sees (JMAP, IMAP, SMTP, CalDAV, CardDAV) — then reports healthy
# once seeding is done (the healthcheck gates on a post-seed marker). Tests
# connect to the host-mapped ports below via the STALWART_* env vars (see
# docker/stalwart/README.md and crates/stalwart-harness).
#
# Transport: JMAP + CalDAV + management on plaintext HTTP 8080; SMTP plaintext on
# 25; SMTP submission implicit-TLS on 465; IMAP implicit-TLS on 993 — all Stalwart
# default listeners, using the server's self-signed test certificate (tests trust-skip
# explicitly; this never touches a host trust store). The entrypoint additionally
# provisions STARTTLS listeners for IMAP (143) and SMTP submission (587) — Stalwart
# supports these ports but recommends implicit TLS (993/465), so a fresh bootstrap does
# not create them; we add them to cover the engine's STARTTLS transports.
#
# Determinism: the image is pinned by sha256 digest and the whole setup is driven
# from fixed inputs. Start from a clean slate with `docker compose down -v`
# before `up` (CI always does).

name: stalwart-harness

services:
  stalwart:
    # stalwartlabs/stalwart v1.0.2, pinned by multi-arch digest (linux/amd64 +
    # linux/arm64). Bump deliberately: re-resolve the digest and update CI too.
    #
    # Bumped from v0.16.24 in its own change, after reading every release note from
    # v0.16.25 to v1.0.2 and running the whole gated suite from a wiped volume (see
    # docs/agent-guidance/stalwart-harness.md → "The v0.16.24 → v1.0.2 bump"). What it
    # changed *near* this repo:
    #
    #   - v1 renamed two registry fields entrypoint.sh relies on: `NetworkListener.tlsImplicit`
    #     (now `implicitTls`), which it sends, and `Bootstrap.serverHostname` (now
    #     `defaultHostname`), which its bootstrap-mode check used to look for.
    #     v1's new database layout does not matter here: the harness always bootstraps
    #     from an empty volume, so there is nothing to migrate.
    #   - A share whose every folder is read-only now reports `isReadOnly: true` and lists
    #     no `submission`, so a client bound to it offers neither writes nor sending.
    #   - JMAP Calendars moved to draft-33 / jscalendarbis-22: `version: "2.0"` is now
    #     returned on every event, and `organizerCalendarAddress` is inferred on create.
    #     Nothing the engine sends or reads changed shape.
    #
    # Still true from earlier pins: `ifInState` is enforced (since v0.16.14, re-verified on
    # v1.0.2), and the engine still sends no precondition. From v0.16.21 a `CalendarEvent/set`
    # that asks for scheduling is refused `forbidden` when the account cannot schedule; the
    # harness accounts can, so no test covers it and it was not re-observed on v1.0.2
    # (`docs/agent-guidance/jmap.md`).
    image: stalwartlabs/stalwart:v1.0.2@sha256:154e55adecadfcc4a67044b9b94d482a20286e1101c97a2b322224bb596053d5
    # Self-bootstrapping wrapper: bootstrap via API, restart to full server,
    # create accounts, seed, then run the server in the foreground.
    entrypoint: ["/bin/sh", "/harness/entrypoint.sh"]
    environment:
      # Fixed fallback-admin credential so the management API has a known login
      # from first boot (no random password, no wizard).
      STALWART_RECOVERY_ADMIN: "admin:harness-admin-pw"
      STALWART_HOSTNAME: "mail.test.local"
      HARNESS_ADMIN_PW: "harness-admin-pw"
      HARNESS_ALICE_PW: "harness-alice-pw"
      HARNESS_BOB_PW: "harness-bob-pw"
      HARNESS_CAROL_PW: "harness-carol-pw"
    volumes:
      - ./entrypoint.sh:/harness/entrypoint.sh:ro
      - ./seed.sh:/harness/seed.sh:ro
      - ./seed:/harness/seed:ro
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    ports:
      # host:container, loopback only — never expose a test mail server on all
      # interfaces. High host ports avoid clashing with a real local server.
      - "127.0.0.1:18080:8080" # HTTP: JMAP + CalDAV/CardDAV + management
      - "127.0.0.1:11025:25" # SMTP (plaintext)
      - "127.0.0.1:11465:465" # SMTP submission (implicit TLS) — Stalwart default listener
      - "127.0.0.1:11993:993" # IMAP (implicit TLS)
      - "127.0.0.1:11143:143" # IMAP (STARTTLS) — entrypoint adds this listener
      - "127.0.0.1:11587:587" # SMTP submission (STARTTLS) — entrypoint adds this listener
    # Healthy only once the shared dataset is seeded: the marker is written at
    # the end of the entrypoint, and HTTP liveness must also answer. This is the
    # real readiness signal tests wait on — not a sleep.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /var/lib/stalwart/.harness-ready && curl -fsS http://127.0.0.1:8080/healthz/live >/dev/null || exit 1
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 10s

volumes:
  stalwart-etc:
  stalwart-data:
