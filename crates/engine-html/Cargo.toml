[package]
name = "engine-html"
description = "Mail HTML made safe to render for the PIM sync engine's hosts: an allowlist sanitiser over ammonia, inline cid: images, the strict-CSP reading document with its dark-scheme colour transform and reflow, the print page, and the one link-scheme policy. Pure: no I/O, no async."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The allowlist sanitiser (`sanitize`): hardened, pure Rust, so it cross-compiles to mobile and to
# a server alike. The root `Cargo.toml` records why it is not hand-rolled.
ammonia = { workspace = true }
# Tokenises a message's CSS so a dark render can move its colours (`scheme`). Already in the tree
# as ammonia's own dependency.
cssparser = { workspace = true }
# `InlinePart`, the decoded inline MIME part a `cid:` picture is resolved from.
engine-core = { workspace = true }

[lints]
workspace = true
