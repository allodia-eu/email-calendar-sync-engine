[package]
name = "engine-api"
description = "Stable host facade for provider-neutral mail, calendar, contact, people, recipient, search, sync, and durable write APIs over SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
engine-core = { workspace = true }
engine-store = { workspace = true }
engine-sync = { workspace = true }
engine-provider = { workspace = true }
engine-recurrence = { workspace = true }
engine-search = { workspace = true }
store-sqlite = { workspace = true }
serde = { workspace = true }
# Deserializes the store's normalized object payloads (Value) into the domain types
# the read methods return (Mailbox/Message).
serde_json = { workspace = true }
thiserror = { workspace = true }
# `OffsetDateTime::now_utc` needs time's `std` feature; require it explicitly so the
# crate keeps compiling even if the workspace dep ever turns default features off.
time = { workspace = true, features = ["std"] }

[dev-dependencies]
# `sync` adds tokio::sync::oneshot, used to deterministically interleave two syncs
# in the concurrent-scope (ApiError::Busy) test.
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
tempfile = { workspace = true }
# The streaming `Provider::stream_email` test fakes yield a single-chunk stream via
# `futures_util::stream::iter`.
futures-util = { workspace = true }

[lints]
workspace = true
