[package]
name = "engine-sieve"
description = "Sieve (RFC 5228) scripts for the PIM sync engine: a lexer and a segmenter that split a script at its top-level commands, byte for byte, and the rule dialect (Roundcube's) read into and written from the neutral rule model. Pure: no I/O, no async; hostile input yields an error or an opaque rule, never a panic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No parser dependency, deliberately. A full Sieve parser would buy semantics the rule model does
# not use, and the one widely used Rust implementation (`sieve-rs`) is `AGPL-3.0-only OR
# LicenseRef-SEL`, which an MPL-2.0 engine cannot take (`docs/design/filters-and-out-of-office.md`).
[dependencies]
# The neutral rule model the dialect reads into and writes from.
engine-core = { workspace = true }

[lints]
workspace = true
