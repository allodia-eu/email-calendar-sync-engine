[package]
name = "engine-provider"
description = "Provider/transport trait surface for the PIM sync engine: a minimal, provider-neutral contract that adapters (JMAP now; IMAP/SMTP/CalDAV later) implement to return normalized SyncUpdate batches plus opaque cursors, expose capabilities, and classify failures. No network dependencies, and of the async runtime only tokio's timer (the deadline on asking a credential source); connections live in the provider crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
engine-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
# `futures-core` for the `Stream` in the email streaming primitive's return type;
# `futures-util` for the drain default that collects the stream into one update.
futures-core = { workspace = true }
futures-util = { workspace = true }
# Only for `HttpVersion::from_http`, which maps what `reqwest::Response::version`
# returns onto the engine's `HttpVersion`. Optional so this crate stays dependency-light
# for the pure-logic consumers (`engine-sync`, `engine-api`); the three HTTP provider
# adapters turn it on. `http` is a leaf crate reqwest already resolves.
http = { workspace = true, optional = true }
# Only for `same_origin`, the rule that keeps an account's credentials off a host
# named by remote *content* (a vCard `PHOTO` URI). Optional alongside `http` for the
# same reason: the pure-logic consumers never speak HTTP. `url` is a leaf crate
# reqwest already resolves.
url = { workspace = true, optional = true }
# Only for the conformance kit's clock (`import-conformance`): the undated control must carry
# the server's time now, which needs the time now.
time = { workspace = true, optional = true }
# The one buffer a credential's secret lives in is zeroed when its last clone drops
# (`credential::Secret`).
zeroize = { workspace = true }
# Only the timer: an ask to a host's `CredentialSource` runs under the deadline of the step it
# belongs to, so a hung token endpoint or broker cannot hang a dial or a request
# (`credential::with_credential`). Every adapter already runs on tokio.
tokio = { workspace = true, features = ["time"] }

[features]
# The import seam (`engine_provider::import`): storing an object that already exists, as it was.
# Not a sync verb, so a host that never imports (a migration, a webmail's upload, an app's file
# import all do) never compiles it.
import = []
# The checks every `MailImporter` must pass against a real target
# (`engine_provider::import::conformance`), written once for every adapter's live suite. For
# dev-dependencies only: it panics on a failed claim.
import-conformance = ["import", "dep:time"]
# The `HttpVersion::from_http` conversion and the `same_origin` credential guard
# (and their `http`/`url` dependencies). Enabled by the reqwest-backed adapters:
# `provider-jmap`, `provider-caldav`, `provider-graph`, `provider-google`.
http = ["dep:http", "dep:url"]

[dev-dependencies]
# `test-util` for the paused clock the credential-ask deadline is tested on.
tokio = { workspace = true, features = ["time", "test-util"] }
serde_json = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
