[package]
name = "provider-jmap"
description = "JMAP mail, calendar, and RFC 9610 contact read/write adapter with HTTP session discovery, batched method calls, push, blobs, and normalized sync updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
engine-core = { workspace = true }
# `http` enables `HttpVersion::from_http`, the one place a reqwest response's version is
# mapped onto the engine's neutral `HttpVersion` (`ConnectionInfo`).
engine-provider = { workspace = true, features = ["http"] }
# One shared TLS trust policy across every provider (`docs/agent-guidance/tls.md`);
# `reqwest` enables the preconfigured-client builder this HTTP transport uses.
# One throttling answer for every HTTP provider (docs/agent-guidance/http-throttling.md).
engine-http = { workspace = true }
engine-tls = { workspace = true, features = ["reqwest"] }
# Mail rules over JMAP Sieve: the script split at its commands, read and written in the dialect.
engine-sieve = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# `try_stream!` builds the email chunk stream from the member-page loop.
async-stream = { workspace = true }
# `buffer_unordered` overlaps a batch's individual downloads (`blob_batch`).
futures-util = { workspace = true }
engine-rfc5322 = { workspace = true, optional = true }

[features]
# Importing into an account (`engine_provider::import::MailImporter` for `JmapProvider`):
# `Email/import`, with the bytes sent inline by RFC 9404 `Blob/upload` where they fit, base64
# encoded by the engine's one outbound codec.
import = ["engine-provider/import", "dep:engine-rfc5322"]
# Exposes `fuzz_parse` for the `fuzz/` cargo-fuzz target; off in normal builds.
fuzzing = []

[dev-dependencies]
# `time` (workspace default omits it) powers the live watch test's bounded wait.
tokio = { workspace = true, features = ["time", "test-util", "net", "io-util", "sync"] }
# The silent servers the deadline tests meet (`engine_http::test_server`), and `test-util`
# above for the paused clock they are measured on.
engine-http = { workspace = true, features = ["test-server"] }
# The scheduling fixture dates its invitation a fixed offset from today — a server only
# auto-schedules a meeting that has not already finished — which needs calendar-aware date
# arithmetic (month/year rollover), not a duration in seconds.
time = { workspace = true }
# `StreamExt` to drain the email chunk stream in the offline sync tests.
futures-util = { workspace = true }
stalwart-harness = { path = "../stalwart-harness" }
# The import claims every adapter's live suite shares (`tests/live_import.rs`).
engine-provider = { workspace = true, features = ["import-conformance"] }
# The live scheduling tests observe organiser and attendee copies over CalDAV and clean
# both scheduling inboxes after creating and changing the meeting through JMAP.
provider-caldav = { workspace = true }
# The live iMIP test reads the message the *server* built back through the engine's own
# inbound scheduling bridge — the same detection an arriving invitation goes through — so
# the assertion is about what a client would see, not about a string in the raw source.
engine-mime = { workspace = true }
# The gated live integration test drives the full loop through the real store.
engine-store = { workspace = true }
engine-search = { workspace = true }
engine-recurrence = { workspace = true }
engine-sync = { workspace = true }
store-sqlite = { workspace = true }
# The process-kill suite's store files, one directory per case.
tempfile = { workspace = true }

[lints]
workspace = true
