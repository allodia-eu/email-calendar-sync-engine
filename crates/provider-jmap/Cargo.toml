[package]
name = "provider-jmap"
description = "JMAP mail, calendar, and RFC 9610 contact read/write adapter with HTTP session discovery, batched method calls, push, blobs, and normalized sync updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
engine-core = { workspace = true }
# `http` enables `HttpVersion::from_http`, the one place a reqwest response's version is
# mapped onto the engine's neutral `HttpVersion` (`ConnectionInfo`).
engine-provider = { workspace = true, features = ["http"] }
# One shared TLS trust policy across every provider (`docs/agent-guidance/tls.md`);
# `reqwest` enables the preconfigured-client builder this HTTP transport uses.
engine-tls = { workspace = true, features = ["reqwest"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# `try_stream!` builds the email chunk stream from the member-page loop.
async-stream = { workspace = true }

[features]
# Exposes `fuzz_parse` for the `fuzz/` cargo-fuzz target; off in normal builds.
fuzzing = []

[dev-dependencies]
# `time` (workspace default omits it) powers the live watch test's bounded wait.
tokio = { workspace = true, features = ["time"] }
# `StreamExt` to drain the email chunk stream in the offline sync tests.
futures-util = { workspace = true }
stalwart-harness = { path = "../stalwart-harness" }
# The live RSVP test seeds its invitation with a CalDAV PUT: JMAP has no whole-document
# write and `EventDraft` cannot state an ORGANIZER/ATTENDEE pair, so an invitation cannot
# be created over JMAP at all. Test-only, and only for the counterparty's fixture.
provider-caldav = { workspace = true }
# The live iMIP test reads the message the *server* built back through the engine's own
# inbound scheduling bridge — the same detection an arriving invitation goes through — so
# the assertion is about what a client would see, not about a string in the raw source.
engine-mime = { workspace = true }
# The gated live integration test drives the full loop through the real store.
engine-store = { workspace = true }
engine-search = { workspace = true }
engine-recurrence = { workspace = true }
engine-sync = { workspace = true }
store-sqlite = { workspace = true }

[lints]
workspace = true
