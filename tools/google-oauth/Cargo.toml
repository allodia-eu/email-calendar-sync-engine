# Standalone dev tool — NOT part of the engine workspace (its own `[workspace]`
# table detaches it from `crates/*`), so it never affects the engine's
# fmt/clippy/coverage gates. It exists only to drive the interactive Google
# OAuth 2.0 flow against a throwaway test account and to capture real Gmail /
# Google Calendar JSON responses as offline test fixtures for `provider-google`.
[package]
name = "google-oauth"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "google-oauth"
path = "src/main.rs"

[dependencies]
# Blocking HTTP keeps the tool runtime-free; rustls so there is no OpenSSL
# requirement (mirrors the engine's TLS posture).
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "form"] }
serde_json = "1.0.150"
# PKCE S256: SHA-256 of the verifier, base64url-encoded (no padding).
sha2 = "0.11.0"
base64 = "0.22.1"

# Detach from the engine workspace above this directory.
[workspace]
